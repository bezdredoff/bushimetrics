name: Refresh catalog data
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/manual_overrides.json'
      - 'requirements.txt'
      - '.github/workflows/refresh-data.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-catalog-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Collect full Weiss Schwarz printing catalog
        run: python scripts/collect_weiss.py
      - name: Collect full Palworld printing catalog
        run: python scripts/collect_palworld.py
      - name: Build browser catalog
        run: python scripts/build_catalog.py
      - name: Validate catalog scale
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/catalog.json',encoding='utf-8'))
          c=d['counts']
          print(c)
          assert c['weiss'] >= 5000, c
          assert c['palworld'] >= 150, c
          assert c['imaged'] >= c['total'] * .90, c
          PY
      - name: Store immutable daily snapshot
        shell: bash
        run: |
          mkdir -p data/snapshots
          cp data/catalog.json "data/snapshots/catalog-$(date -u +%F).json"
      - name: Validate snapshot history
        run: python scripts/backtest.py
      - name: Commit refreshed data
        shell: bash
        run: |
          if git diff --quiet -- data; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: refresh card catalog $(date -u +%F)"
          git push
