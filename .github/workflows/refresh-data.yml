name: Refresh catalog data
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/manual_overrides.json'
      - 'data/printing_overrides.json'
      - 'data/verified-jp-variants.json'
      - 'data/scarcity.json'
      - 'data/market_overrides.json'
      - 'data/palworld-current-overrides.json'
      - 'requirements.txt'
      - '.github/workflows/refresh-data.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-catalog-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout BushiMetrics
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout Weiss catalog source
        uses: actions/checkout@v4
        with:
          repository: GachaWiki/gacha-wiki
          path: external/gacha-wiki
          sparse-checkout: |
            src/data/ws-cards
            LICENSE
          sparse-checkout-cone-mode: false
          filter: blob:none

      - name: Checkout Japanese Weiss catalog source
        uses: actions/checkout@v4
        with:
          repository: Akenaide/wsoffdata
          ref: master
          path: external/wsoffdata

      - name: Checkout Palworld catalog source
        uses: actions/checkout@v4
        with:
          repository: dragogodev/cgs
          ref: master
          path: external/cgs
          sparse-checkout: |
            Palworld/AllCards.json
          sparse-checkout-cone-mode: false
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Collect full Weiss Schwarz printing catalog
        run: python scripts/collect_weiss.py

      - name: Collect complete current Palworld catalog
        run: python scripts/collect_palworld.py

      - name: Collect Japanese Weiss Schwarz printing catalog
        run: python scripts/collect_weiss_jp.py

      - name: Build lazy Japanese Weiss catalog
        run: python scripts/build_weiss_jp_catalog.py

      - name: Enrich public Cardmarket EUR prices
        run: python scripts/enrich_market_cardmarket.py

      - name: Enrich public TCGCSV / TCGplayer USD prices
        run: python scripts/enrich_market_tcgcsv.py

      - name: Enrich Palworld completed-sale prices
        run: python scripts/enrich_market_palworldprices.py

      - name: Incrementally enrich TCGPlayer USD prices
        env:
          TCGAPI_KEY: ${{ secrets.TCGAPI_KEY }}
          TCGAPI_DAILY_REQUEST_BUDGET: '80'
        run: python scripts/enrich_market_tcgapi.py

      - name: Build analytical catalog
        run: python scripts/build_catalog.py

      - name: Build compact Pages browser catalog
        run: python scripts/build_web_catalog.py

      - name: Validate catalog scale and coverage
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/catalog.json',encoding='utf-8'))
          c=d['counts']
          freshness=json.load(open('data/market-freshness-audit.json',encoding='utf-8'))
          for currency,field in (('USD','market'),('EUR','marketEUR')):
              expected=sum(
                  card.get('availability')=='released'
                  and isinstance(card.get(field),(int,float))
                  and card.get(field)>0
                  for card in d['cards']
              )
              counts=freshness['currencies'][currency]
              assert counts['priced']==expected,(currency,expected,counts)
              assert sum(counts[key] for key in
                  ('fresh','stale','undated','invalid-or-future-date'))==expected,counts
          print('Market freshness coverage',freshness['currencies'])
          print(c)
          assert c['weiss'] >= 20000, c
          en_audit=json.load(open('data/en-identity-audit.json',encoding='utf-8'))
          assert en_audit['uniquePrintingsByCode'] == c['weissEN'], en_audit
          assert (en_audit['englishSetFiles'] + en_audit['nonEnglishSetFiles']
                  + en_audit['invalidSetFiles']) == en_audit['sourceFiles'], en_audit
          assert (en_audit['validCodeRows'] + en_audit['missingCodeRows']
                  + en_audit['invalidCardRows']) == en_audit['cardRows'], en_audit
          assert (en_audit['uniquePrintingsByCode'] + en_audit['duplicateCodeRows']
                  == en_audit['validCodeRows']), en_audit
          print('EN source identity audit', {k:en_audit[k] for k in (
              'sourceFiles','cardRows','duplicateCodeRows','conflictingCodeGroups'
          )})
          assert sum(x['game']=='palworld' and x.get('availability')=='released' for x in d['cards']) == 276, c
          assert c['imaged'] >= c['released'] * .90, c
          assert c['sets'] >= 100, c
          web=json.load(open('data/web/meta.json',encoding='utf-8'))
          print('Web payload',web)
          assert web['searchENCards'] >= 30000, web
          assert web['searchJPCards'] >= 50000, web
          assert web['bootstrapBytes'] < 2_000_000, web
          assert web['searchENBytes'] < 12_000_000, web
          assert web['searchJPBytes'] < 16_000_000, web
          assert web['setFileMaxBytes'] < 6_000_000, web
          assert web['setFilesEN'] >= 100, web
          assert web['setFilesJP'] >= 100, web
          jp=json.load(open('data/catalog-weiss-jp-meta.json',encoding='utf-8'))
          audit=json.load(open('data/jp-identity-audit.json',encoding='utf-8'))
          assert audit['uniquePrintingsByCode'] == jp['counts']['total'], audit
          assert audit['verifiedVariantRows'] == 2, audit
          assert audit['unresolvedConflictingCodeGroups'] == 0, audit
          jp_cards=json.load(open('data/catalog-weiss-jp.json',encoding='utf-8'))['cards']
          for verified_code in ('GZL/SE33-12','GZL/SE33-23'):
              rarities={x['r'] for x in jp_cards if x.get('c')==verified_code}
              assert rarities == {'RR','SEC'}, (verified_code,rarities)

          assert audit['parsedFiles'] + audit['invalidFiles'] == audit['sourceFiles'], audit
          assert (audit['uniquePrintingsByCode'] + audit['discardedDuplicateFiles']
                  + audit['missingCardCodeFiles']) == audit['parsedFiles'], audit
          print('JP upstream identity audit', {k:audit[k] for k in (
              'sourceFiles','duplicateCodeFiles','conflictingCodeGroups','invalidFiles'
          )})
          print('JP',jp['counts'])
          assert jp['counts']['total'] >= 50000, jp['counts']
          assert jp['counts']['imaged'] >= jp['counts']['released'] * .90, jp['counts']
          import os
          jp_bytes=os.path.getsize('data/catalog-weiss-jp.json')
          print('JP payload bytes',jp_bytes)
          assert jp_bytes < 50_000_000, jp_bytes
          PY

      - name: Store compact market snapshot
        run: python scripts/snapshot_metrics.py

      - name: Build lazy card price-history shards
        run: python scripts/build_history_shards.py

      - name: Validate walk-forward history
        run: python scripts/backtest.py

      - name: Commit refreshed data
        shell: bash
        run: |
          if git diff --quiet -- data; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: refresh card catalog $(date -u +%F)"
          # Never force-push stale generated data over newer model or catalog changes.
          if ! git push origin HEAD:main; then
            echo "::error::main advanced during refresh; next run must regenerate from latest main"
            exit 1
          fi
