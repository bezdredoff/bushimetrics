name: Cardmarket identity-source audit
on:
  pull_request:
    paths:
      - scripts/enrich_market_cardmarket.py
      - tests/test_cardmarket_mapping.py
      - .github/workflows/cardmarket-identity-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout English Weiss printing identities
        uses: actions/checkout@v4
        with:
          repository: GachaWiki/gacha-wiki
          path: external/gacha-wiki
          sparse-checkout: |
            src/data/ws-cards
            LICENSE
          sparse-checkout-cone-mode: false
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Test collector identity matching without network
        run: python -m unittest discover -s tests -p 'test_cardmarket_mapping.py' -v
      - name: Collect authoritative English source identity baseline
        run: python scripts/collect_weiss.py
      - name: Run actual Cardmarket daily-download matcher
        run: python scripts/enrich_market_cardmarket.py
      - name: Verify mapping is from new code, never a legacy cache
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('data/market/cardmarket.json').read_text(encoding='utf-8'))
          stats=data['stats']
          assert 'collisionCodeGroups' in stats, 'Actual new Cardmarket mapping not verified; fallback cache is not enough'
          assert stats['matchedCards'] == len(data['cards'])
          assert sum(stats['matchMethods'].values()) == stats['matchedCards']
          audit={k:stats[k] for k in (
              'catalogCards','publishedProducts','priceRows','matchedCards',
              'candidateProducts','collisionCodeGroups','collisionProducts',
              'explicitNumberNotFound','explicitNumberAmbiguous',
              'explicitRarityConflict','ambiguousProducts','insufficientIdentity',
              'unmatchedProducts','invalidPriceRows','matchMethods'
          )}
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/cardmarket-match-summary.json').write_text(
              json.dumps({'status':'vetted-identity-matching-v1',**audit,
                          'collisionExamples':stats['collisionExamples'][:20],
                          'rejectionExamples':stats['rejectionExamples'][:20]},
                         indent=2),encoding='utf-8'
          )
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('### Cardmarket price-guide to printing audit\n\n')
              for key,value in audit.items():
                  f.write(f'- **{key}**: {value}\n')
              f.write('\nNo mismatched or multiply claimed printing receives a price guide.\n')
          print('Cardmarket physical-identity audit',audit)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardmarket-matching-evidence
          path: artifacts/cardmarket-match-summary.json
          retention-days: 14
          if-no-files-found: warn
