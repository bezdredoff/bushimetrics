name: One-time obsolete branch removal

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-legacy-branches-once.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove specifically authorized non-main branches
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const targets = [
              'fix/github-native-catalog',
              'fix/pages-branch-deploy',
              'fix/pages-set-catalog-v2'
            ];
            const expected = new Set(targets);
            const listing = await github.paginate(github.rest.repos.listBranches,
              {owner, repo, per_page: 100});
            const other = listing.filter(b => b.name !== 'main').map(b => b.name);
            const unknown = other.filter(name => !expected.has(name));
            if (unknown.length) {
              core.setFailed('Refusing to delete any branches while unexpected new branches exist: ' + unknown.join(', '));
              return;
            }
            const openPRs = await github.paginate(github.rest.pulls.list,
              {owner, repo, state: 'open', per_page: 100});
            const active = openPRs.filter(pr =>
              pr.head.repo?.full_name === owner + '/' + repo &&
              expected.has(pr.head.ref));
            if (active.length) {
              core.setFailed('Refusing to remove branches for open PRs: ' +
                active.map(pr => pr.number + ' ' + pr.head.ref).join(', '));
              return;
            }
            const results = [];
            for (const branch of listing.filter(b => expected.has(b.name))) {
              if (branch.protected) {
                results.push({branch: branch.name, sha: branch.commit.sha, status: 'protected — not deleted'});
                core.error('Branch protected: ' + branch.name);
                continue;
              }
              try {
                await github.rest.git.deleteRef({owner, repo, ref: 'heads/' + branch.name});
                results.push({branch: branch.name, sha: branch.commit.sha, status: 'deleted'});
                core.info('Deleted obsolete branch ' + branch.name + ' at ' + branch.commit.sha);
              } catch (e) {
                results.push({branch: branch.name, sha: branch.commit.sha, status: 'error: ' + e.message});
                core.error('Could not delete ' + branch.name + ': ' + e.message);
              }
            }
            const remaining = (await github.paginate(github.rest.repos.listBranches,
              {owner, repo, per_page: 100})).map(b => b.name);
            await core.summary.addHeading('One-time branch cleanup')
              .addRaw('This workflow never deletes main; original branch tip SHAs are retained in the run log.')
              .addTable([
                [{data:'Branch',header:true},{data:'Commit',header:true},{data:'Outcome',header:true}],
                ...results.map(r=>[r.branch,r.sha,r.status])
              ])
              .addRaw('Remaining branches: ' + remaining.join(', '))
              .write();
            if (remaining.some(name => name !== 'main')) {
              core.setFailed('Cleanup incomplete: remaining non-main branches: ' +
                remaining.filter(name=>name !== 'main').join(', '));
            }
