name: CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout BushiMetrics
        uses: actions/checkout@v4

      - name: Checkout Weiss catalog source
        uses: actions/checkout@v4
        with:
          repository: GachaWiki/gacha-wiki
          path: external/gacha-wiki
          sparse-checkout: |
            src/data/ws-cards
            LICENSE
          sparse-checkout-cone-mode: false
          filter: blob:none

      - name: Checkout Japanese Weiss catalog source
        uses: actions/checkout@v4
        with:
          repository: Akenaide/wsoffdata
          ref: master
          path: external/wsoffdata

      - name: Checkout Palworld catalog source
        uses: actions/checkout@v4
        with:
          repository: dragogodev/cgs
          ref: master
          path: external/cgs
          sparse-checkout: |
            Palworld/AllCards.json
          sparse-checkout-cone-mode: false
          filter: blob:none

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: pip install -r requirements.txt
      - run: python -m py_compile scripts/*.py
      - run: node --check assets/app.js
      - run: python scripts/collect_weiss.py
      - run: python scripts/collect_palworld.py
      - run: python scripts/collect_weiss_jp.py
      - run: python scripts/build_weiss_jp_catalog.py
      - run: python scripts/enrich_market_tcgcsv.py --max-groups 30 --require-match
      - run: python scripts/enrich_market_palworldprices.py
      - run: python scripts/build_catalog.py
      - run: python scripts/build_web_catalog.py
      - name: Validate source-dated current demand and neutral activity counts
        run: |
          python - <<'PY'
          import json
          catalog=json.load(open('data/catalog.json',encoding='utf-8'))
          audit=json.load(open('data/current-demand-audit.json',encoding='utf-8'))
          cards=catalog['cards']
          assert audit['schemaVersion']==1
          assert audit['cardsAssessed']==len(cards)
          assert catalog['modelVersion']=='0.9-evidence-gated-iq-peer-fair-v0.8'
          eligible=[c for c in cards if c.get('demandPressure') is not None]
          heat=[c for c in cards if c.get('marketHeatPercentile') is not None]
          assert len(eligible)==audit['eligibleDemandRatios']
          assert len(heat)==audit['eligibleCrossSectionalHeat']
          assert sum(audit['exclusionReasons'].values())==len(cards)
          for c in eligible:
              assert c.get('marketAskAsOf') and c.get('marketAsOf')
              assert not c.get('marketStale')
              assert c.get('priceSource','').startswith('Palworld Prices')
          for c in cards:
              if c.get('liquidityEvidenceStatus')=='neutral-prior-no-current-activity':
                  assert c['modelFactors']['liquidity']==25
              if c.get('momentumEvidenceStatus')=='neutral-prior-no-current-independent-movement':
                  assert c['momentum']==50
          print('Current market activity evidence gate validated:',len(eligible),'pressure cards,',len(heat),'heat ranks')
          PY
      - name: Generate version-separated walk-forward status from immutable snapshots
        run: python scripts/backtest.py
      - name: Check pending reports cannot claim accuracy without dated evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('data/backtest-status.json').read_text(encoding='utf-8'))
          assert report['schemaVersion']==2
          for horizon in report['horizons']:
              assert horizon['horizonDays'] in (30,90,180)
              for model in horizon['byModel']:
                  for metric in model['currencies'].values():
                      if metric['status']=='pending':
                          assert metric['mae'] is None and metric['directional'] is None
          assert all(
              metric.get('exclusionReasons') is not None
              for horizon in report['horizons']
              for model in horizon['byModel']
              for metric in model['currencies'].values()
          )
          print('Versioned backtest accuracy gate passed')
          PY

      - name: Validate complete generated catalog
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/catalog.json',encoding='utf-8'))
          c=d['counts']
          freshness=json.load(open('data/market-freshness-audit.json',encoding='utf-8'))
          for currency,field in (('USD','market'),('EUR','marketEUR')):
              expected=sum(
                  card.get('availability')=='released'
                  and isinstance(card.get(field),(int,float))
                  and card.get(field)>0
                  for card in d['cards']
              )
              counts=freshness['currencies'][currency]
              assert counts['priced']==expected,(currency,expected,counts)
              assert sum(counts[key] for key in
                  ('fresh','stale','undated','invalid-or-future-date'))==expected,counts
          print('Market freshness coverage',freshness['currencies'])
          print(c)
          assert c['weiss'] >= 20000, c
          en_audit=json.load(open('data/en-identity-audit.json',encoding='utf-8'))
          assert en_audit['uniquePrintingsByCode'] == c['weissEN'], en_audit
          assert (en_audit['englishSetFiles'] + en_audit['nonEnglishSetFiles']
                  + en_audit['invalidSetFiles']) == en_audit['sourceFiles'], en_audit
          assert (en_audit['validCodeRows'] + en_audit['missingCodeRows']
                  + en_audit['invalidCardRows']) == en_audit['cardRows'], en_audit
          assert (en_audit['uniquePrintingsByCode'] + en_audit['duplicateCodeRows']
                  == en_audit['validCodeRows']), en_audit
          print('EN source identity audit', {k:en_audit[k] for k in (
              'sourceFiles','cardRows','duplicateCodeRows','conflictingCodeGroups'
          )})
          assert sum(x['game']=='palworld' and x.get('availability')=='released' for x in d['cards']) == 276, c
          assert c['imaged'] >= c['released'] * .90, c
          assert d.get('sets'), 'set summary missing'
          ids=[x['id'] for x in d['cards']]
          assert len(ids)==len(set(ids)), 'duplicate generated ids'
          pal=[x for x in d['cards'] if x['game']=='palworld' and x.get('availability')=='released']
          priced=[x for x in pal if x.get('market') is not None]
          print('Palworld priced',len(priced),'of',len(pal))
          assert len(priced) >= 150, f'Palworld sold-price coverage too low: {len(priced)}'
          char=[x for x in d['cards'] if x.get('characterPremiumIndex') is not None]
          print('Character premium observations on',len(char),'printings')
          assert len(char) >= 1000, f'character premium coverage too low: {len(char)}'
          pressure=[x for x in pal if x.get('demandPressure') is not None]
          print('Demand pressure observations on',len(pressure),'Palworld printings')
          assert len(pressure) >= 100, f'demand pressure coverage too low: {len(pressure)}'
          web=json.load(open('data/web/meta.json',encoding='utf-8'))
          print('Web payload',web)
          assert web['searchENCards'] >= 30000, web
          assert web['searchJPCards'] >= 50000, web
          assert web['bootstrapBytes'] < 2_000_000, web
          assert web['searchENBytes'] < 12_000_000, web
          assert web['searchJPBytes'] < 16_000_000, web
          assert web['setFileMaxBytes'] < 6_000_000, web
          assert web['setFilesEN'] >= 100, web
          assert web['setFilesJP'] >= 100, web
          jp=json.load(open('data/catalog-weiss-jp-meta.json',encoding='utf-8'))
          audit=json.load(open('data/jp-identity-audit.json',encoding='utf-8'))
          assert audit['uniquePrintingsByCode'] == jp['counts']['total'], audit
          assert audit['verifiedVariantRows'] == 2, audit
          assert audit['unresolvedConflictingCodeGroups'] == 0, audit
          jp_cards=json.load(open('data/catalog-weiss-jp.json',encoding='utf-8'))['cards']
          for verified_code in ('GZL/SE33-12','GZL/SE33-23'):
              rarities={x['r'] for x in jp_cards if x.get('c')==verified_code}
              assert rarities == {'RR','SEC'}, (verified_code,rarities)

          assert audit['parsedFiles'] + audit['invalidFiles'] == audit['sourceFiles'], audit
          assert (audit['uniquePrintingsByCode'] + audit['discardedDuplicateFiles']
                  + audit['missingCardCodeFiles']) == audit['parsedFiles'], audit
          print('JP upstream identity audit', {k:audit[k] for k in (
              'sourceFiles','duplicateCodeFiles','conflictingCodeGroups','invalidFiles'
          )})
          print('JP Weiss',jp['counts'])
          assert jp['counts']['total'] >= 50000, jp['counts']
          assert jp['counts']['imaged'] >= jp['counts']['released'] * .90, jp['counts']
          import os
          jp_bytes=os.path.getsize('data/catalog-weiss-jp.json')
          print('JP payload bytes',jp_bytes)
          assert jp_bytes < 50_000_000, jp_bytes
          fair=[x for x in d['cards'] if x.get('fairValueConfidence') in ('High','Medium') and (x.get('fair') is not None or x.get('fairEUR') is not None)]
          print('High/medium peer fair value on',len(fair),'printings')
          assert len(fair) >= 250, f'peer fair-value coverage too low: {len(fair)}'
          PY
